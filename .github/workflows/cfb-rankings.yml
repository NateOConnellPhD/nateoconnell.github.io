name: Update and publish CFB rankings
run-name: ${{ inputs.mode == 'history' && 'Backfill historical CFB rankings' || 'Update current CFB rankings' }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Current rankings, or resume historical weekly backfill'
        default: current
        type: choice
        options: [current, history]
      season:
        description: 'Season: current, or a year from 2002 onward'
        default: 'current'
        required: true
        type: string
      refresh_metadata:
        description: 'Refresh roster/calendar too (two additional requests)'
        default: false
        type: boolean
      retry_failed:
        description: 'History mode: retry weeks that previously failed sampling checks'
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - 'scripts/cfb/**'
      - 'assets/js/cfb-policy*.js'
      - 'assets/js/cfb-exact-order.js'
  schedule:
    - cron: '17 8 * 8-12 0'
      timezone: 'America/New_York'

permissions:
  contents: write
  pages: write
  actions: write

concurrency:
  group: cfb-data
  cancel-in-progress: false
  # Do not replace a waiting daily projection with the next archive week.
  queue: max

jobs:
  update:
    if: github.repository == 'NateOConnellPhD/nateoconnell.github.io' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      JAX_PLATFORMS: cpu
      MPLBACKEND: Agg
      XDG_CACHE_HOME: ${{ github.workspace }}/.codex-tmp/cfb-refit/cache
      MPLCONFIGDIR: ${{ github.workspace }}/.codex-tmp/cfb-refit/matplotlib
      JAX_COMPILATION_CACHE_DIR: ${{ github.workspace }}/.codex-tmp/cfb-refit/jax-cache
      TMPDIR: ${{ github.workspace }}/.codex-tmp/cfb-refit/tmp
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Check current ranking policy and data boundaries without fitting
        run: |
          NODE=node python3 -B scripts/cfb/test_policy_v5.py
          python3 -B scripts/cfb/test_playoff_scope.py
          python3 -B scripts/cfb/test_strength_structure.py
          python3 -B scripts/cfb/test_sync_data.py
          python3 -B scripts/cfb/test_season_inputs.py
          python3 -B scripts/cfb/test_home_history_inputs.py
          python3 -B scripts/cfb/test_posterior_summary.py
          python3 -B scripts/cfb/test_history.py
          python3 -B scripts/cfb/test_weekly_publication.py
          python3 -B scripts/cfb/test_archive_range.py
          python3 -B scripts/cfb/test_sampling_retry.py
          python3 -B scripts/cfb/test_archive_failures.py
          python3 -B scripts/cfb/test_task_storage.py
          node scripts/cfb/check_navigation.cjs
          node scripts/cfb/check_conferences.cjs
          node scripts/cfb/check_contributions.cjs
      - name: Fetch the season once and check for changed inputs
        id: prepare
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          CFB_SEASON: ${{ inputs.season || 'current' }}
          CFB_REFRESH_METADATA: ${{ inputs.refresh_metadata }}
          CFB_MODE: ${{ inputs.mode || 'current' }}
          CFB_RETRY_FAILED: ${{ inputs.retry_failed }}
        run: |
          mkdir -p "$TMPDIR"
          args=(prepare --season "$CFB_SEASON")
          if [ "$CFB_MODE" = history ]; then
            args+=(--history)
            if [ "$CFB_RETRY_FAILED" = true ]; then
              args+=(--retry-failed)
            fi
          fi
          if [ "$CFB_REFRESH_METADATA" = true ]; then
            args+=(--refresh-metadata)
          fi
          python3 -B scripts/cfb/weekly_publication.py "${args[@]}"
      - uses: actions/setup-python@v7
        if: steps.prepare.outputs.needs_fit == 'true'
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v6
        if: steps.prepare.outputs.needs_fit == 'true'
        id: cache
        with:
          path: |
            .codex-tmp/cfb-refit/home
            .codex-tmp/cfb-refit/fits
            .codex-tmp/cfb-refit/scores
            .codex-tmp/cfb-refit/exact
          key: cfb-20261121-hierarchy-${{ runner.os }}-${{ steps.prepare.outputs.season }}-${{ hashFiles('scripts/cfb/model.py', 'scripts/cfb/requirements.txt') }}-${{ steps.prepare.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            cfb-20261121-hierarchy-${{ runner.os }}-${{ steps.prepare.outputs.season }}-${{ hashFiles('scripts/cfb/model.py', 'scripts/cfb/requirements.txt') }}-${{ steps.prepare.outputs.key }}-
            cfb-20261121-hierarchy-${{ runner.os }}-${{ steps.prepare.outputs.season }}-${{ hashFiles('scripts/cfb/model.py', 'scripts/cfb/requirements.txt') }}-
      - name: Retain only this cutoff's reusable numerical cache
        if: steps.prepare.outputs.needs_fit == 'true'
        run: python3 -B scripts/cfb/prune_task_cache.py
      - name: Install pinned numerical packages into the disposable environment
        if: steps.prepare.outputs.needs_fit == 'true'
        run: |
          python3 -m venv .codex-tmp/cfb-refit/venv
          python3 -B scripts/cfb/run_bounded.py .codex-tmp/cfb-refit/venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir --no-compile --only-binary=:all: -r scripts/cfb/requirements.txt
      - name: Check scoring and publication boundaries
        if: steps.prepare.outputs.needs_fit == 'true'
        run: |
          (cd scripts/cfb && ../../.codex-tmp/cfb-refit/venv/bin/python -B -m unittest test_scoring.CreditTests test_exact_scoring test_ranking_draws)
          .codex-tmp/cfb-refit/venv/bin/python -B scripts/cfb/test_publication.py
          .codex-tmp/cfb-refit/venv/bin/python -B scripts/cfb/test_historical_home.py
          .codex-tmp/cfb-refit/venv/bin/python -B scripts/cfb/test_hierarchical_model.py
          .codex-tmp/cfb-refit/venv/bin/python -B scripts/cfb/test_conference_summary.py
          CFB_TEST_TMP="$TMPDIR" .codex-tmp/cfb-refit/venv/bin/python -B scripts/cfb/test_game_contributions.py
          CFB_TEST_TMP="$TMPDIR" .codex-tmp/cfb-refit/venv/bin/python -B scripts/cfb/test_full_fit_retry.py
          CFB_TEST_TMP="$TMPDIR" .codex-tmp/cfb-refit/venv/bin/python -B scripts/cfb/test_reference_scoring.py
      - name: Fit if needed and save checked rankings
        id: complete
        run: |
          runner=python3
          if [ -x .codex-tmp/cfb-refit/venv/bin/python ]; then
            runner=.codex-tmp/cfb-refit/venv/bin/python
          fi
          python3 -B scripts/cfb/run_bounded.py "$runner" -B scripts/cfb/weekly_publication.py complete
      - name: Record an unsuccessful update without replacing rankings
        if: failure() && steps.prepare.outcome == 'success'
        run: python3 -B scripts/cfb/weekly_publication.py failed
      - name: Commit saved data and ranking snapshots
        id: commit
        if: always() && !cancelled() && (steps.prepare.outcome == 'success' || steps.prepare.outputs.status_saved == 'true')
        run: |
          git add -- _cfb_data/seasons assets/data/cfb
          if git diff --cached --quiet; then
            exit 0
          fi
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update current CFB rankings and saved season data'
          for attempt in 1 2 3; do
            git pull --no-rebase --no-edit origin main
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
      - name: Rebuild the public website
        if: always() && steps.commit.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
      - uses: actions/cache/save@v6
        # Keep any passing fit/LOO work and the home prior after a diagnosed
        # failure. Failed full-fit and exact-LOO draws are never newly saved.
        if: always() && !cancelled() && steps.prepare.outputs.needs_fit == 'true' && (steps.complete.outcome == 'success' || steps.complete.outputs.sampling_failed == 'true')
        with:
          path: |
            .codex-tmp/cfb-refit/home
            .codex-tmp/cfb-refit/fits
            .codex-tmp/cfb-refit/scores
            .codex-tmp/cfb-refit/exact
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Continue the historical queue one checked week at a time
        if: always() && !cancelled() && steps.commit.outcome == 'success' && ((success() && (inputs.mode != 'history' || steps.prepare.outputs.continue_history == 'true')) || (inputs.mode == 'history' && steps.complete.outputs.continue_history == 'true'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run cfb-rankings.yml --ref main -f mode=history
      - name: Remove this job's temporary environment and arrays
        if: always()
        run: rm -rf -- .codex-tmp/cfb-refit
