name: Update CFB projections

on:
  schedule:
    - cron: '23 13 * * *'
  workflow_dispatch:
    inputs:
      season:
        description: 'Forecast season; current rolls forward in July and builds its prior automatically'
        default: current
        type: string
      week:
        description: 'Optional historical forecast week (1–16; 99 for CFP). Blank updates current.'
        default: ''
        type: string
  workflow_run:
    workflows: ['Update and publish CFB rankings']
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'scripts/cfb_forecast/**'
      - '_cfb_data/forecast_priors/**'
      - '_cfb_data/forecast_inputs/**'
      - '.github/workflows/cfb-projections.yml'

permissions:
  contents: write
  pages: write

concurrency:
  group: cfb-data
  cancel-in-progress: false

jobs:
  projections:
    if: github.repository == 'NateOConnellPhD/nateoconnell.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      JAX_PLATFORMS: cpu
      MPLBACKEND: Agg
      XDG_CACHE_HOME: ${{ github.workspace }}/.codex-tmp/cfb-refit/cache
      MPLCONFIGDIR: ${{ github.workspace }}/.codex-tmp/cfb-refit/matplotlib
      JAX_COMPILATION_CACHE_DIR: ${{ github.workspace }}/.codex-tmp/cfb-refit/jax-cache
      TMPDIR: ${{ github.workspace }}/.codex-tmp/cfb-refit/tmp
      CFB_FORECAST_SEASON: ${{ inputs.season || 'current' }}
      CFB_FORECAST_WEEK: ${{ inputs.week || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Refresh current games and model covariates once per day
        id: refresh
        if: inputs.week == '' || github.event_name != 'workflow_dispatch'
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python3 -B scripts/cfb_forecast/refresh.py --season "$CFB_FORECAST_SEASON"
      - name: Refresh optional market comparison once per day
        if: inputs.week == '' || github.event_name != 'workflow_dispatch'
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python3 -B scripts/cfb_forecast/publish.py sync-markets --season "$CFB_FORECAST_SEASON"
      - name: Check saved inputs before installing or sampling
        id: prepare
        run: |
          if [ -z "$CFB_FORECAST_WEEK" ]; then
            if [ "${{ steps.refresh.outputs.history_ready }}" != true ] || [ "${{ steps.refresh.outputs.covariates_ready }}" != true ]; then
              echo 'Waiting for complete new-season inputs; previous forecasts remain available.'
              echo 'needs_update=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "${{ steps.refresh.outputs.needs_prior }}" = true ]; then
              echo 'needs_update=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          args=(--season "$CFB_FORECAST_SEASON")
          if [ -n "$CFB_FORECAST_WEEK" ]; then args+=(--week "$CFB_FORECAST_WEEK"); fi
          python3 -B scripts/cfb_forecast/publish.py prepare "${args[@]}"
      - uses: actions/cache/restore@v6
        if: steps.prepare.outputs.needs_update == 'true'
        with:
          path: |
            .codex-tmp/cfb-refit/forecast-fits
            .codex-tmp/cfb-refit/home
          key: forecast-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: forecast-${{ runner.os }}-
      - uses: actions/setup-python@v7
        if: steps.prepare.outputs.needs_update == 'true'
        with:
          python-version: '3.12'
      - name: Install pinned numerical packages
        if: steps.prepare.outputs.needs_update == 'true'
        run: |
          mkdir -p "$TMPDIR"
          python3 -m venv .codex-tmp/cfb-refit/venv
          python3 -B scripts/cfb/run_bounded.py .codex-tmp/cfb-refit/venv/bin/python -m pip install --no-cache-dir -r scripts/cfb/requirements.txt
      - name: Check projections without sampling
        if: steps.prepare.outputs.needs_update == 'true'
        run: |
          .codex-tmp/cfb-refit/venv/bin/python -B scripts/cfb_forecast/test_forecasts.py
          .codex-tmp/cfb-refit/venv/bin/python -B scripts/cfb_forecast/test_v7.py
          .codex-tmp/cfb-refit/venv/bin/python -B scripts/cfb_forecast/test_refresh.py
          node scripts/cfb_forecast/check_projections.cjs
      - name: Build changed or new-season prior with the supplied estimators
        if: steps.prepare.outputs.needs_update == 'true' && steps.refresh.outputs.needs_prior == 'true'
        run: python3 -B scripts/cfb/run_bounded.py .codex-tmp/cfb-refit/venv/bin/python -B scripts/cfb_forecast/publish.py build-prior --season "$CFB_FORECAST_SEASON"
      - name: Fit independently and publish checked forecasts
        if: steps.prepare.outputs.needs_update == 'true'
        run: |
          args=(--season "$CFB_FORECAST_SEASON")
          if [ -n "$CFB_FORECAST_WEEK" ]; then args+=(--week "$CFB_FORECAST_WEEK"); fi
          python3 -B scripts/cfb/run_bounded.py .codex-tmp/cfb-refit/venv/bin/python -B scripts/cfb_forecast/publish.py complete "${args[@]}"
      - name: Save passing fit caches
        if: always() && !cancelled() && steps.prepare.outputs.needs_update == 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            .codex-tmp/cfb-refit/forecast-fits
            .codex-tmp/cfb-refit/home
          key: forecast-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Commit checked inputs and any passing forecast
        if: always() && !cancelled()
        run: |
          git add -- assets/data/cfb/projections
          git add -- _cfb_data/seasons _cfb_data/forecast_inputs _cfb_data/forecast_priors
          if [ -d _cfb_data/forecast_markets ]; then git add -- _cfb_data/forecast_markets; fi
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update power projections from saved games'
          for attempt in 1 2 3; do
            git pull --no-rebase --no-edit origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
      - name: Rebuild public website
        if: success() && steps.prepare.outputs.needs_update == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
      - name: Clean up job-owned numerical environment
        if: always()
        run: rm -rf -- .codex-tmp/cfb-refit
