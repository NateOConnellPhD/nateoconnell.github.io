name: Update CFB projections

on:
  workflow_dispatch:
    inputs:
      season:
        description: 'Forecast season (requires its reviewed preseason prior)'
        default: current
        type: string
  workflow_run:
    workflows: ['Update and publish CFB rankings']
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'scripts/cfb_forecast/**'
      - '_cfb_data/forecast_priors/**'
      - '.github/workflows/cfb-projections.yml'

permissions:
  contents: write
  pages: write

concurrency:
  group: cfb-projections
  cancel-in-progress: false

jobs:
  projections:
    if: github.repository == 'NateOConnellPhD/nateoconnell.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      JAX_PLATFORMS: cpu
      MPLBACKEND: Agg
      XDG_CACHE_HOME: ${{ github.workspace }}/.codex-tmp/cfb-refit/cache
      MPLCONFIGDIR: ${{ github.workspace }}/.codex-tmp/cfb-refit/matplotlib
      JAX_COMPILATION_CACHE_DIR: ${{ github.workspace }}/.codex-tmp/cfb-refit/jax-cache
      TMPDIR: ${{ github.workspace }}/.codex-tmp/cfb-refit/tmp
      CFB_FORECAST_SEASON: ${{ inputs.season || 'current' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Check saved inputs before installing or sampling
        id: prepare
        run: python3 -B scripts/cfb_forecast/publish.py prepare --season "$CFB_FORECAST_SEASON"
      - uses: actions/cache/restore@v6
        if: steps.prepare.outputs.needs_update == 'true'
        with:
          path: |
            .codex-tmp/cfb-refit/forecast-fits
            .codex-tmp/cfb-refit/forecast-gap
            .codex-tmp/cfb-refit/home
          key: forecast-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: forecast-${{ runner.os }}-
      - uses: actions/setup-python@v7
        if: steps.prepare.outputs.needs_update == 'true'
        with:
          python-version: '3.12'
      - name: Install pinned numerical packages
        if: steps.prepare.outputs.needs_update == 'true'
        run: |
          mkdir -p "$TMPDIR"
          python3 -m venv .codex-tmp/cfb-refit/venv
          python3 -B scripts/cfb/run_bounded.py .codex-tmp/cfb-refit/venv/bin/python -m pip install --no-cache-dir -r scripts/cfb/requirements.txt
      - name: Check projections without sampling
        if: steps.prepare.outputs.needs_update == 'true'
        run: |
          .codex-tmp/cfb-refit/venv/bin/python -B scripts/cfb_forecast/test_forecasts.py
          node scripts/cfb_forecast/check_projections.cjs
      - name: Fit independently and publish checked forecasts
        if: steps.prepare.outputs.needs_update == 'true'
        run: python3 -B scripts/cfb/run_bounded.py .codex-tmp/cfb-refit/venv/bin/python -B scripts/cfb_forecast/publish.py complete --season "$CFB_FORECAST_SEASON"
      - name: Save passing fit caches
        if: always() && !cancelled() && steps.prepare.outputs.needs_update == 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            .codex-tmp/cfb-refit/forecast-fits
            .codex-tmp/cfb-refit/forecast-gap
            .codex-tmp/cfb-refit/home
          key: forecast-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Commit only projections
        if: success() && steps.prepare.outputs.needs_update == 'true'
        run: |
          git add -- assets/data/cfb/projections
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update power projections from saved games'
          for attempt in 1 2 3; do
            git pull --no-rebase --no-edit origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
      - name: Rebuild public website
        if: success() && steps.prepare.outputs.needs_update == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
      - name: Clean up job-owned numerical environment
        if: always()
        run: rm -rf -- .codex-tmp/cfb-refit
