name: "Nathaniel S. O’Connell, PhD"
role: "Associate Professor"
department: "Department of Biostatistics and Data Science"
division: "Division of Public Health Science"
affiliation: "Wake Forest University School of Medicine"
introduction: "My research includes uncertainty quantification in machine learning and prediction models, Bayesian adaptive trial design, and collaborative biomedical research. Years of applied work have shaped the questions behind my increasing focus on statistical methodology and theory."
email: "nathaniel.oconnell@wfusm.edu"
portrait: "/assets/images/head-shot.jpg"
portrait_alt: "Portrait of Nathaniel S. O’Connell"
preview_mode: false
interests:
  - name: "Uncertainty in machine learning"
    description: "Statistical theory and methods for quantifying uncertainty in prediction models and their performance, with particular attention to random forests and the dependence created by reusing data."
  - name: "Cross-validation"
    description: "How resampling designs affect performance estimates and how to estimate their uncertainty."
  - name: "Bayesian adaptive trial design"
    description: "Bayesian methods for designing clinical trials that adapt as evidence accumulates, with a particular interest in dose finding and dose optimization."
