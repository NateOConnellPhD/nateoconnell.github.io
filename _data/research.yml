introduction: |
  My current methodological and theoretical research brings together questions I have been thinking about through years of collaborative biomedical work. In applications involving machine learning and prediction, I repeatedly encountered uncertainty about how much confidence to place in predictions, performance estimates, and selected variables, without finding satisfactory answers. Those experiences motivate the methods I am developing now and my increasing focus on statistical theory.

  I study how uncertainty arises throughout the learning procedure: from the data we collect, the models we fit, and the choices we make about training, tuning, and evaluation. My recent work develops theory for the variance of random forests and cross-validation, alongside methods for estimating that uncertainty in practice. A related line of research examines how cross-validation affects the stability of lasso coefficients and selected variables. Together, these projects ask how the design of an analysis shapes its statistical behavior, and how that understanding can guide the way we use prediction methods.

  These questions remain closely connected to my applied work. My background in Bayesian dose-finding trials also informs ongoing research on adaptive designs that use repeated patient outcomes, accounting for dependence within patients as evidence accumulates. Across these areas, I aim to turn problems encountered in collaboration into statistical methods with a clear account of what they estimate and how uncertain those estimates are.
clinical_introduction: |
  My clinical collaborations span cancer treatment and survivorship, cardiovascular health, and migraine, among other areas. These studies represent some of my major collaborations, examining how treatments affect patients during care and in the years that follow.
