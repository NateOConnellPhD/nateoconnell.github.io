introduction: |
  My growing focus on methods and theory comes from years of collaborative biomedical research. In developing machine learning and prediction models, I kept running into questions about how much confidence to place in predictions, estimates of model performance, and the variables a model selects. I often couldn’t find satisfactory answers, particularly ones that helped me make decisions in practice. Those questions stayed with me, and much of my current research is an effort to answer them. Going forward, I plan to spend more of my time on this work.

  I’m interested in how the decisions we make when building and evaluating a model affect its results and the uncertainty around them. **In other words, my research interests lie at the intersection of prediction modeling and inference.** My current projects focus on the variance of random forests and cross-validation, both developing the theory to understand that variance and finding ways to estimate it in practice. I’m also studying how cross-validation affects the stability of LASSO coefficients and variable selection. These projects grew out of wanting to better understand methods I use routinely, especially what their results can tell us and where we may be placing too much confidence in them.

  I also continue to work on clinical trial design, where my methodological research began during my PhD. Building on that background in Bayesian dose-finding trials, I’m developing adaptive designs that use repeated patient outcomes to guide decisions as a study progresses, while accounting for the dependence among observations from the same patient. As with my work on prediction models, the motivation comes from problems I’ve encountered through collaboration and want better ways to address.
clinical_introduction: |
  I’ve spent much of my career working alongside clinical investigators, with more than 70 coauthored papers across oncology, cardiovascular disease, pediatrics, neurology, emergency medicine, and other areas. As a collaborative biostatistician, I work on study design and statistical analysis, helping investigators connect the questions they want to answer with what we can learn from the data.

  Several of the studies highlighted below focus on the effects of cancer treatment on patients’ lives: changes in heart function, fatigue that persists after treatment, and the burden of adverse events that are classified as low or moderate grade. My first-author JCO paper, for example, examines how those adverse events relate to patients’ treatment experience and treatment discontinuation. Other collaborations include work with Rebecca Wells on mindfulness as a treatment for migraine.

  I also serve as Director of Biostatistics for the [ARISE Cancer Consortium](https://www.arisecancer.org/), a multisite pediatric oncology consortium across North and South Carolina, where I lead biostatistics for studies across the consortium.
