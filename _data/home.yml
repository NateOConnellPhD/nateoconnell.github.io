eyebrow: "Biostatistics & data science"
heading: "Nathaniel O’Connell, PhD"
research_intro: "My current methodological and theoretical research brings together questions I have been thinking about through years of collaborative biomedical work. In applications involving machine learning and prediction, I repeatedly encountered uncertainty about how much confidence to place in predictions, performance estimates, and selected variables, without finding satisfactory answers. Those experiences motivate the methods I am developing now and my increasing focus on statistical theory."
blog_intro: "Technical posts and things I explore just for fun."
contact_heading: "Get in touch"
contact_text: "I welcome conversations about research and collaboration. Students interested in my work are encouraged to get in touch about research mentorship and dissertation committee involvement."
