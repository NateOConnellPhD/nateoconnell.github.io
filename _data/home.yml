eyebrow: "Biostatistics & data science"
heading: "Nathaniel O’Connell, PhD"
research_intro: "My growing focus on methods and theory comes from years of collaborative biomedical research. Over the last several years, much of my time has been spent thinking through and developing clinical prediction models, often using machine learning. Through that work, I’ve become increasingly bothered by how disconnected prediction modeling can feel from the ideas about uncertainty and inference I rely on as a statistician. I want to know how much confidence to place in an individual prediction, how uncertain a model’s performance estimate from cross-validation is, and how much I can trust the variables a model selects. I’ve often struggled to find satisfactory answers in the statistical literature, especially ones I can use to guide decisions in practice. These are questions I’ve been thinking about for years, and much of my current research is an effort to answer them. As I move forward in my career, I plan to spend more of my time on theory and methods, particularly addressing these issues."
blog_intro: "Technical posts and things I explore just for fun."
contact_heading: "Get in touch"
contact_text: |
  I welcome conversations about research and collaboration.

  ### Students and mentorship

  I encourage students interested in machine learning, statistical inference, or adaptive trial design to reach out. Although our department does not have a graduate program of its own, I welcome opportunities to mentor students in other programs, including through research collaborations and service on dissertation committees. If your interests overlap with mine, please [email me](mailto:nathaniel.oconnell@wfusm.edu) with a brief introduction and a little about the questions you would like to explore.
